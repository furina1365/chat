name: chat

services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "53411:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      chat:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/hello"]
      interval: 10s
      timeout: 3s
      retries: 5

  chat:
    build: .
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json:ro
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:53411/api/hello"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${CHAT_MYSQL_ROOT_PASSWORD:?请通过 python3 docker/compose.py 启动并在 config.json 中设置 MySQL root 密码}
      MYSQL_DATABASE: chat
      MYSQL_USER: chat
      MYSQL_PASSWORD: ${CHAT_MYSQL_PASSWORD:?请通过 python3 docker/compose.py 启动并在 config.json 中设置数据库密码}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/02-app-grants.sql:/docker-entrypoint-initdb.d/02-app-grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1 FROM turn_requests LIMIT 0'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:8.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  redis_data:
