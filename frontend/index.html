<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fcfcfb">
  <title>Chat · 新对话</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/katex.css">
  <link rel="stylesheet" href="/src/styles.css">
</head>

<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-chevron-down" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6" />
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="m5 12 4 4L19 6" />
    </symbol>
    <symbol id="icon-panel" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2" />
      <path d="M9 4v16" />
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14" />
    </symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24">
      <rect x="6" y="6" width="12" height="12" rx="2" />
    </symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24">
      <path d="M12 19V5m-6 6 6-6 6 6" />
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5" />
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24">
      <rect x="8" y="8" width="12" height="12" rx="2" />
      <path d="M15 8V4H4v11h4" />
    </symbol>
    <symbol id="icon-retry" viewBox="0 0 24 24">
      <path d="M3 11a9 9 0 1 1 9 9M3 4v7h7" />
    </symbol>
    <symbol id="icon-chat" viewBox="0 0 24 24">
      <path d="M21 15a3 3 0 0 1-3 3H9l-6 4V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3Z" />
      <path d="M8 10h8m-8 4h5" />
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="m9.5 3-.6 2.3-2 .9-2.2-.6-2.5 4.3 1.7 1.7v2.3l-1.7 1.7 2.5 4.3 2.2-.6 2 .9.6 2.3h5l.6-2.3 2-.9 2.2.6 2.5-4.3-1.7-1.7v-2.3l1.7-1.7-2.5-4.3-2.2.6-2-.9L14.5 3Z" />
      <circle cx="12" cy="12.7" r="3" />
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" /></symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24">
      <rect x="5" y="10" width="14" height="11" rx="3" /><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
    </symbol>
    <symbol id="icon-mail" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="3" /><path d="m4 7 8 6 8-6" />
    </symbol>
    <symbol id="icon-devices" viewBox="0 0 24 24">
      <path d="M11 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3M6 21h5m-3-4v4" />
      <rect x="15" y="10" width="7" height="12" rx="2" /><path d="M18 19h1" />
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4" /><path d="M4 21v-2a8 8 0 0 1 16 0v2" />
    </symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24">
      <path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4m5-13 5 5-5 5M8 12h11" />
    </symbol>
  </svg>
  <section class="auth-screen" id="auth-screen" aria-labelledby="auth-title">
    <div class="auth-card">
      <a class="auth-brand" href="#">Chat<span>让想法继续。</span></a>
      <h1 id="auth-title">欢迎回来</h1>
      <p class="auth-intro" id="auth-intro">登录后，继续你的对话。</p>
      <form id="auth-form" class="account-form">
        <label id="auth-username-label" hidden>用户名<input id="auth-username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z][A-Za-z0-9_]{2,31}"></label>
        <label id="auth-identifier-label">用户名或邮箱<input id="auth-identifier" autocomplete="username" maxlength="254" required></label>
        <label id="auth-email-label" hidden>邮箱<span id="auth-email-hint">可选，验证后可用于登录和找回密码。</span><input id="auth-email" type="email" autocomplete="email" maxlength="254"></label>
        <label id="auth-code-label" hidden>邮箱验证码<input id="auth-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"></label>
        <label id="auth-password-label">密码<input id="auth-password" type="password" autocomplete="current-password" maxlength="128" required></label>
        <label id="auth-confirm-label" hidden>确认密码<input id="auth-confirm" type="password" autocomplete="new-password" maxlength="128"></label>
        <p id="auth-status" role="status" aria-live="polite"></p>
        <button class="primary-button" id="auth-submit" type="submit">登录</button>
      </form>
      <div class="auth-links">
        <button class="text-button" id="auth-switch" type="button">创建账号</button>
        <button class="text-button" id="auth-forgot" type="button">忘记密码</button>
        <button class="text-button" id="auth-reset" type="button" hidden>已有验证码</button>
      </div>
    </div>
  </section>
  <div class="app-shell" hidden>
    <aside class="sidebar" id="sidebar" aria-label="会话导航">
      <header class="sidebar-header">
        <button class="icon-button" id="close-sidebar" title="收起侧栏" aria-label="收起侧栏"><svg>
            <use href="#icon-panel" />
          </svg></button>
        <a class="brand" href="#" id="brand">Chat</a>
      </header>
      <button class="new-chat" id="new-chat"><svg>
          <use href="#icon-plus" />
        </svg>新对话</button>
      <div class="history-section">
        <h2>最近对话</h2>
        <nav id="conversation-list" aria-label="历史对话"></nav>
        <p class="history-empty" id="history-empty">还没有对话</p>
        <button class="text-button" id="more-history" type="button" hidden>加载更多</button>
      </div>
      <div class="sidebar-account">
        <button class="account-entry" id="open-account" type="button" popovertarget="account-menu" aria-expanded="false" aria-controls="account-menu" title="账号菜单">
          <span class="avatar" id="account-avatar" aria-hidden="true">C</span>
          <span class="account-entry-copy"><span id="account-name">我的账号</span></span>
          <svg class="account-entry-settings" aria-hidden="true"><use href="#icon-chevron-down" /></svg>
        </button>
        <nav id="account-menu" class="account-menu" popover="auto" aria-label="账号菜单">
          <button type="button" data-account-view="username"><svg aria-hidden="true"><use href="#icon-user" /></svg>修改用户名</button>
          <button type="button" data-account-view="password"><svg aria-hidden="true"><use href="#icon-lock" /></svg>修改密码</button>
          <button type="button" data-account-view="email"><svg aria-hidden="true"><use href="#icon-mail" /></svg>邮箱</button>
          <button type="button" data-account-view="devices"><svg aria-hidden="true"><use href="#icon-devices" /></svg>已登录设备</button>
          <hr>
          <button type="button" id="menu-logout"><svg aria-hidden="true"><use href="#icon-logout" /></svg>退出登录</button>
        </nav>
      </div>
    </aside>
    <button class="sidebar-overlay" id="sidebar-overlay" aria-label="关闭侧栏" hidden></button>
    <main class="workspace" id="workspace">
      <header class="topbar">
        <button class="icon-button" id="open-sidebar" title="展开侧栏" aria-label="展开侧栏" aria-controls="sidebar"
          aria-expanded="false"><svg>
            <use href="#icon-panel" />
          </svg></button>
        <span id="conversation-title">新对话</span>
        <button class="text-button" id="rename-conversation" type="button" hidden>重命名</button>
      </header>
      <div class="conversation-scroll" id="conversation-scroll">
        <section class="welcome" id="welcome">
          <div class="welcome-heading"><svg class="welcome-icon" aria-hidden="true">
              <use href="#icon-chat" />
            </svg>
            <h1>今天，有什么想聊的？</h1>
          </div>
        </section>
        <section class="messages" id="messages" aria-label="对话消息" aria-busy="false"></section>
      </div>
      <div class="composer-area">
        <form class="composer" id="chat-form">
          <label class="sr-only" for="prompt">发送给 AI 的消息</label>
          <div class="composer-input">
            <textarea id="prompt" rows="1" placeholder="有什么我可以帮你？" maxlength="20000" autocomplete="off"></textarea>
            <button class="send-button stop-button" id="stop" type="button" title="停止生成" aria-label="停止生成" hidden><svg>
                <use href="#icon-stop" />
              </svg></button>
            <button class="send-button" id="send" type="submit" title="发送消息" aria-label="发送消息" disabled><svg>
                <use href="#icon-arrow" />
              </svg></button>
          </div>
          <div class="composer-toolbar">
            <div class="composer-status">
              <p id="status" role="status" aria-live="polite"></p><button id="retry" class="text-button" type="button" hidden>重试</button>
            </div>
            <div class="model-picker">
              <button id="model-select" type="button" aria-label="选择模型和思考强度" aria-haspopup="dialog"
                popovertarget="model-menu" aria-controls="model-menu" aria-expanded="false" disabled>
                <span id="model-label">正在加载模型…</span>
                <svg class="model-chevron" aria-hidden="true"><use href="#icon-chevron-down" /></svg>
              </button>
              <div class="model-menu" id="model-menu" popover="auto" role="dialog" aria-label="模型和思考强度">
                <fieldset class="model-menu-group" id="model-options">
                  <legend>模型</legend>
                </fieldset>
                <fieldset class="model-menu-group effort-options" id="effort-options" hidden>
                  <legend>思考强度</legend>
                  <div class="effort-choices">
                    <label><input type="radio" name="reasoning-effort" value="high">High</label>
                    <label><input type="radio" name="reasoning-effort" value="max">Max</label>
                  </div>
                </fieldset>
              </div>
              <button class="icon-button" id="reload-models" type="button" title="重新加载模型" aria-label="重新加载模型"
                hidden><svg>
                  <use href="#icon-retry" />
                </svg></button></div>
          </div>
        </form>
      </div>
    </main>
    <main id="account-page" class="account-page" aria-labelledby="account-title" hidden>
      <div class="account-page-content">
        <header class="account-heading">
          <div class="account-heading-main">
            <button id="account-back" class="icon-button account-back" type="button" aria-label="返回账号设置" hidden><svg aria-hidden="true"><use href="#icon-arrow" /></svg></button>
            <h2 id="account-title" tabindex="-1">账号设置</h2>
          </div>
          <button class="device-logout-all" id="devices-logout-all" type="button" data-account-view="logout-all" hidden>退出全部设备</button>
          <button id="close-account" class="text-button account-close" type="button">返回对话</button>
        </header>
        <p id="account-status" role="status" aria-live="polite"></p>
        <div id="account-home" class="account-home" data-account-panel="home">
          <div class="settings-list" role="group" aria-label="账号与安全">
            <button class="settings-row" type="button" data-account-view="username">
              <span class="settings-icon"><svg aria-hidden="true"><use href="#icon-user" /></svg></span>
              <span class="settings-copy"><strong>用户名</strong><small id="username-overview"></small></span>
              <svg class="settings-chevron" aria-hidden="true"><use href="#icon-chevron-down" /></svg>
            </button>
            <button class="settings-row" type="button" data-account-view="password">
              <span class="settings-icon"><svg aria-hidden="true"><use href="#icon-lock" /></svg></span>
              <span class="settings-copy"><strong>修改密码</strong></span>
              <svg class="settings-chevron" aria-hidden="true"><use href="#icon-chevron-down" /></svg>
            </button>
            <button class="settings-row" type="button" data-account-view="email">
              <span class="settings-icon"><svg aria-hidden="true"><use href="#icon-mail" /></svg></span>
              <span class="settings-copy"><strong>邮箱</strong><small id="email-overview">尚未绑定</small></span>
              <svg class="settings-chevron" aria-hidden="true"><use href="#icon-chevron-down" /></svg>
            </button>
            <button class="settings-row" type="button" data-account-view="devices">
              <span class="settings-icon"><svg aria-hidden="true"><use href="#icon-devices" /></svg></span>
              <span class="settings-copy"><strong>已登录设备</strong></span>
              <svg class="settings-chevron" aria-hidden="true"><use href="#icon-chevron-down" /></svg>
            </button>
          </div>
          <div class="account-session-actions" role="group" aria-label="退出登录">
            <button class="account-logout" id="logout" type="button" title="退出当前设备，其他设备保持登录"><svg aria-hidden="true"><use href="#icon-logout" /></svg>退出登录</button>
            <button class="account-logout account-logout-all" type="button" data-account-view="logout-all">退出全部设备</button>
          </div>
        </div>
        <section class="account-panel" data-account-panel="username" hidden>
          <p class="field-hint" id="username-hint">3–32 位字母、数字或下划线，以字母开头。保存后使用新用户名登录。</p>
          <form id="username-form" class="account-form">
            <label>新用户名<input name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z][A-Za-z0-9_]{2,31}" aria-describedby="username-hint" autocapitalize="none" spellcheck="false"></label>
            <button class="primary-button" type="submit">保存用户名</button>
          </form>
        </section>
        <section class="account-panel" data-account-panel="password" hidden>
          <p class="field-hint">修改后，所有设备都需要重新登录。</p>
          <form id="password-form" class="account-form">
            <label>当前密码<input name="old_password" type="password" autocomplete="current-password" required maxlength="128"></label>
            <label>新密码<input name="new_password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="8–128 个字符"></label>
            <label>确认新密码<input name="confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
            <button class="primary-button" type="submit">更新密码</button>
          </form>
        </section>
        <section class="account-panel" data-account-panel="email" hidden>
          <p class="field-hint">为保护账号安全，请先验证当前密码。</p>
          <form id="email-verify-form" class="account-form">
            <label>当前密码<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
            <button class="primary-button" type="submit">下一步</button>
          </form>
        </section>
        <section class="account-panel" data-account-panel="email-edit" hidden>
          <p id="email-summary" class="field-hint">绑定后可用邮箱登录和找回密码。</p>
          <form id="email-form" class="account-form">
            <label><span id="email-address-label">邮箱地址</span><input name="email" type="email" autocomplete="email" required maxlength="254"></label>
            <div class="verification-row"><label>验证码<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button class="secondary-button" id="email-send" type="button">发送验证码</button></div>
            <div class="account-actions"><button class="primary-button" type="submit">验证并绑定</button><button class="text-button" id="email-unbind" type="button" hidden>解绑邮箱</button></div>
          </form>
        </section>
        <section class="account-panel" data-account-panel="devices" hidden>
          <p id="devices-status" class="field-hint" role="status" aria-live="polite"></p>
          <table class="device-table" aria-label="已登录设备">
            <thead><tr><th scope="col">设备</th><th scope="col">登录时间</th><th scope="col">最近活动</th><th scope="col"><span class="sr-only">操作</span></th></tr></thead>
            <tbody id="device-list"></tbody>
          </table>
          <div class="device-footer"><button id="devices-more" class="text-button" type="button" hidden>加载更多</button></div>
        </section>
        <section class="account-panel" data-account-panel="logout-device" hidden>
          <p id="logout-device-description" class="logout-description"></p>
          <form id="logout-device-form" class="confirmation-actions">
            <button class="secondary-button" id="cancel-logout-device" type="button">取消</button>
            <button class="primary-button danger-button" type="submit">退出该设备</button>
          </form>
        </section>
        <section class="account-panel" data-account-panel="logout-all" hidden>
          <p class="logout-description">当前设备和其他设备都会退出。再次使用时，需要重新登录。</p>
          <form id="logout-all-form" class="confirmation-actions">
            <button class="secondary-button" id="cancel-logout-all" type="button">取消</button>
            <button class="primary-button danger-button" id="logout-all" type="submit">退出全部设备</button>
          </form>
        </section>
      </div>
    </main>
  </div>
  <script src="/vendor/markdown.js"></script>
  <script src="/src/app.js"></script>
</body>

</html>
