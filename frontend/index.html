<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fcfcfb">
  <title>Chat · 新对话</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/katex.css">
  <link rel="stylesheet" href="src/styles.css">
</head>

<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-chevron-down" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6" />
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="m5 12 4 4L19 6" />
    </symbol>
    <symbol id="icon-panel" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2" />
      <path d="M9 4v16" />
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14" />
    </symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24">
      <rect x="6" y="6" width="12" height="12" rx="2" />
    </symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24">
      <path d="M12 19V5m-6 6 6-6 6 6" />
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5" />
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24">
      <rect x="8" y="8" width="12" height="12" rx="2" />
      <path d="M15 8V4H4v11h4" />
    </symbol>
    <symbol id="icon-retry" viewBox="0 0 24 24">
      <path d="M3 11a9 9 0 1 1 9 9M3 4v7h7" />
    </symbol>
    <symbol id="icon-chat" viewBox="0 0 24 24">
      <path d="M21 15a3 3 0 0 1-3 3H9l-6 4V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3Z" />
      <path d="M8 10h8m-8 4h5" />
    </symbol>
  </svg>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="会话导航">
      <header class="sidebar-header">
        <button class="icon-button" id="close-sidebar" title="收起侧栏" aria-label="收起侧栏"><svg>
            <use href="#icon-panel" />
          </svg></button>
        <a class="brand" href="#" id="brand">Chat</a>
      </header>
      <button class="new-chat" id="new-chat"><svg>
          <use href="#icon-plus" />
        </svg>新对话</button>
      <div class="history-section">
        <h2>最近对话</h2>
        <nav id="conversation-list" aria-label="历史对话"></nav>
        <p class="history-empty" id="history-empty">还没有对话</p>
      </div>
    </aside>
    <button class="sidebar-overlay" id="sidebar-overlay" aria-label="关闭侧栏" hidden></button>
    <main class="workspace" id="workspace">
      <header class="topbar">
        <button class="icon-button" id="open-sidebar" title="展开侧栏" aria-label="展开侧栏" aria-controls="sidebar"
          aria-expanded="false"><svg>
            <use href="#icon-panel" />
          </svg></button>
        <span id="conversation-title">新对话</span>
      </header>
      <div class="conversation-scroll" id="conversation-scroll">
        <section class="welcome" id="welcome">
          <div class="welcome-heading"><svg class="welcome-icon" aria-hidden="true">
              <use href="#icon-chat" />
            </svg>
            <h1>今天，有什么想聊的？</h1>
          </div>
        </section>
        <section class="messages" id="messages" aria-label="对话消息" aria-busy="false"></section>
      </div>
      <div class="composer-area">
        <form class="composer" id="chat-form">
          <label class="sr-only" for="prompt">发送给 AI 的消息</label>
          <div class="composer-input">
            <textarea id="prompt" rows="1" placeholder="有什么我可以帮你？" maxlength="20000" autocomplete="off"></textarea>
            <button class="send-button stop-button" id="stop" type="button" title="停止生成" aria-label="停止生成" hidden><svg>
                <use href="#icon-stop" />
              </svg></button>
            <button class="send-button" id="send" type="submit" title="发送消息" aria-label="发送消息" disabled><svg>
                <use href="#icon-arrow" />
              </svg></button>
          </div>
          <div class="composer-toolbar">
            <div class="composer-status">
              <p id="status" role="status" aria-live="polite"></p><button id="retry" class="text-button" type="button" hidden>重试</button>
            </div>
            <div class="model-picker">
              <button id="model-select" type="button" aria-label="选择模型" aria-haspopup="listbox"
                popovertarget="model-menu" aria-controls="model-menu" aria-expanded="false" disabled>
                <span id="model-label">正在加载模型…</span>
                <svg class="model-chevron" aria-hidden="true"><use href="#icon-chevron-down" /></svg>
              </button>
              <div class="model-menu" id="model-menu" popover="auto" role="listbox" aria-label="选择模型"></div>
              <button class="icon-button" id="reload-models" type="button" title="重新加载模型" aria-label="重新加载模型"
                hidden><svg>
                  <use href="#icon-retry" />
                </svg></button></div>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script src="vendor/markdown.js"></script>
  <script src="src/app.js"></script>
</body>

</html>
